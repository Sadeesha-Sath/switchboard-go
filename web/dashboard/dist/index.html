<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/dashboard/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switchboard Go — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/dashboard/assets/index-B7v1B3wL.js"></script>
    <link rel="stylesheet" crossorigin href="/dashboard/assets/index-DJTxz1-C.css">
  </head>
  <body>
    <div class="dashboard-root">
      <div class="dashboard-container">
        <!-- Top Navigation Bar -->
        <header class="topbar">
          <div class="brand">
            <img src="/dashboard/mark.svg" alt="Switchboard Go" class="brand-mark" />
            <div>
              <div class="brand-title">Switchboard Go</div>
              <div id="server-info" class="num brand-subtitle">Connecting…</div>
            </div>
          </div>
          <div class="topbar-controls">
            <span id="updated-label" class="num updated-label">updated —</span>
            <div class="seg-group" role="radiogroup" aria-label="Auto refresh">
              <label class="num segl active" id="label-auto-on">
                <input type="radio" name="auto-toggle" id="radio-auto-on" value="auto" checked />
                <span id="auto-label-text">Auto 30s</span>
              </label>
              <label class="num segl" id="label-auto-off">
                <input type="radio" name="auto-toggle" id="radio-auto-off" value="hold" />
                <span>Hold</span>
              </label>
            </div>
            <button type="button" id="refresh-btn" class="iconbtn" aria-label="Refresh now" title="Refresh now">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M8 16H3v5"></path>
              </svg>
            </button>
            <div class="menu-container">
              <button type="button" id="menu-btn" class="iconbtn" aria-label="Dashboard actions" title="Dashboard actions" aria-haspopup="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
                  <circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
                  <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
                </svg>
              </button>
              <div id="dropdown-menu" class="dropdown-menu" hidden>
                <div class="menuitem" data-action="validate">Validate keys</div>
                <div class="menuitem" data-action="reload">Reload config</div>
                <div class="menuitem" data-action="settings">Settings</div>
                <div class="rule" style="margin: var(--space-1) 0;"></div>
                <div class="menuitem accent-item" data-action="reset-all">Reset all quotas</div>
              </div>
            </div>
          </div>
        </header>

        <div class="rule" style="margin: var(--space-6) 0 var(--space-6);"></div>

        <div id="error-banner" class="banner" hidden></div>

        <main>
          <!-- Pool Usage Section -->
          <section id="pool-section"></section>

          <div class="rule" style="margin: var(--space-8) 0 var(--space-6);"></div>

          <!-- Two-column main content: Left: Workspace, Right: Keys & Traffic -->
          <div class="cols">
            <section id="workspace-section"></section>
            <div>
              <section id="keys-section"></section>
              <div class="rule" style="margin: var(--space-6) 0;"></div>
              <section id="traffic-section"></section>
            </div>
          </div>
        </main>

        <div class="rule" style="margin: var(--space-8) 0 var(--space-4);"></div>

        <!-- Footer -->
        <footer id="footer-section"></footer>
      </div>
    </div>

    <!-- Settings Dialog -->
    <dialog id="settings-dialog" class="dialog-modal">
      <div class="dialog-backdrop" id="settings-backdrop">
        <div class="dialog" role="dialog" aria-labelledby="settings-title">
          <div class="dialog-header">
            <h2 id="settings-title" class="dialog-title">Dashboard Settings</h2>
            <button type="button" id="settings-close-btn" class="iconbtn sm" aria-label="Close settings">&times;</button>
          </div>
          <form id="settings-form">
            <div class="field">
              <label for="base-url">Proxy Base URL</label>
              <input type="text" id="base-url" class="input" placeholder="http://127.0.0.1:8495 (blank = this origin)" autocomplete="url" />
            </div>
            <div class="field">
              <label for="proxy-key">Proxy API Key</label>
              <input type="password" id="proxy-key" class="input" placeholder="server.proxy_api_key from config.yaml" autocomplete="off" />
            </div>
            <div class="field">
              <label for="poll-interval">Auto-Refresh Interval</label>
              <select id="poll-interval" class="input">
                <option value="5000">5 seconds</option>
                <option value="10000">10 seconds</option>
                <option value="30000" selected>30 seconds</option>
                <option value="60000">60 seconds</option>
                <option value="0">Off (Hold)</option>
              </select>
            </div>
            <p class="dialog-body">
              The API key is stored only in this browser's localStorage and sent as <code>Authorization: Bearer</code>.
            </p>
            <div class="dialog-actions">
              <button type="button" id="clear-key" class="btn btn-secondary">Clear key</button>
              <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
          </form>
        </div>
      </div>
    </dialog>

    <!-- Raw JSON Dialog -->
    <dialog id="raw-json-dialog" class="dialog-modal">
      <div class="dialog-backdrop" id="raw-json-backdrop">
        <div class="dialog dialog-lg" role="dialog" aria-labelledby="raw-json-title">
          <div class="dialog-header">
            <h2 id="raw-json-title" class="dialog-title">Metrics Snapshot JSON</h2>
            <button type="button" id="raw-json-close-btn" class="iconbtn sm" aria-label="Close">&times;</button>
          </div>
          <pre id="raw-json-content" class="raw-json-pre"></pre>
          <div class="dialog-actions">
            <button type="button" id="raw-json-copy-btn" class="btn btn-secondary">Copy JSON</button>
            <button type="button" id="raw-json-done-btn" class="btn btn-primary">Done</button>
          </div>
        </div>
      </div>
    </dialog>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

  </body>
</html>
